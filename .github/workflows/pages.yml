name: Publicar portafolio en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Prepare browser for UI checks
        shell: bash
        run: |
          for demo_browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$demo_browser" >/dev/null 2>&1; then
              echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v "$demo_browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
      - run: npm run test:demos
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      deployments: write
    steps:
      - name: Remove superseded Pages deployment records and build copies
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            let deploymentsRemoved = 0;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {...repo, environment: 'github-pages', per_page: 100});
            for (const deployment of deployments) {
              if (deployment.sha === context.sha) continue;
              try {
                await github.rest.repos.createDeploymentStatus({...repo, deployment_id: deployment.id, state: 'inactive'});
                await github.rest.repos.deleteDeployment({...repo, deployment_id: deployment.id});
                deploymentsRemoved++;
              } catch (error) {
                core.warning(`A retired deployment record could not be removed (HTTP ${error.status}).`);
              }
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...repo, per_page: 100});
            let runsRemoved = 0;
            for (const run of runs) {
              if (run.id === context.runId || run.name !== context.workflow || run.status !== 'completed') continue;
              await github.rest.actions.deleteWorkflowRun({...repo, run_id: run.id});
              runsRemoved++;
            }
            core.info(`Removed ${deploymentsRemoved} retired deployment records and ${runsRemoved} previous workflow runs/artifacts.`);
